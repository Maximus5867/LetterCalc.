<!doctype html>
<html lang="en">
<head>
  <link rel="apple-touch-icon" sizes="794x794" href="./icon.png?v=2">
  <link rel="icon" type="image/png" href="./icon.png?v=2">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>LetterCalc — Base 26</title>
<style>
:root{color-scheme:dark;--bg:#100817;--panel:#1a1024;--panel2:#251431;--line:#48245c;--text:#f7efff;--muted:#b49ac3;--accent:#c000ff;--accent2:#e0a0ff}
*{box-sizing:border-box}body{margin:0;min-height:100vh;background:radial-gradient(ellipse at 50% -20%,#34203f 0,transparent 52%),var(--bg);color:var(--text);font:16px/1.45 system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;display:grid;place-items:center;padding:24px}
.app{width:min(100%,480px)}.top{display:flex;align-items:center;justify-content:space-between;margin-bottom:18px}.brand{font-size:12px;letter-spacing:.2em;text-transform:uppercase;color:var(--muted)}.badge{font-size:11px;border:1px solid var(--line);border-radius:99px;padding:5px 9px;color:var(--accent)}
h1{font-size:clamp(30px,7vw,42px);letter-spacing:-.05em;margin:0 0 5px}.sub{color:var(--muted);margin:0 0 22px;font-size:14px}
.calc{border:1px solid var(--line);border-radius:24px;background:rgba(18,26,45,.96);padding:18px;box-shadow:0 22px 70px #0005}
.display{background:#08050b;border:1px solid #382044;border-radius:16px;padding:16px;margin-bottom:14px;min-height:138px;display:flex;flex-direction:column;justify-content:space-between;gap:12px}
.expression{color:var(--muted);font-size:15px;overflow-wrap:anywhere;min-height:22px}.result{font-size:clamp(34px,9vw,48px);font-weight:750;letter-spacing:.025em;overflow-wrap:anywhere;line-height:1.12}.decimal{font-size:12px;color:var(--muted);overflow-wrap:anywhere}
.keys{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:9px}.key{min-height:52px;border:1px solid var(--line);border-radius:13px;background:var(--panel2);color:var(--text);font:600 17px system-ui,sans-serif;cursor:pointer;transition:transform .08s,border-color .15s}.key:active{transform:scale(.97)}.key:focus-visible{outline:2px solid var(--accent);outline-offset:2px}.key.op{color:var(--accent);background:#2c1537}.key.utility{color:#d2d9eb;background:#26172e}.key.equals{background:var(--accent);color:#17051d;border-color:var(--accent);font-size:22px}.key.wide{grid-column:span 2}.key.alpha{font-size:15px;letter-spacing:.03em}
.note{margin:14px 3px 0;color:var(--muted);font-size:12px}.history{margin-top:14px;border-top:1px solid var(--line);padding-top:12px}.history-head{display:flex;justify-content:space-between;align-items:center;color:var(--muted);font-size:12px;text-transform:uppercase;letter-spacing:.1em}.history-list{display:flex;flex-direction:column;gap:7px;margin-top:8px}.hist{width:100%;text-align:left;border:1px solid var(--line);border-radius:10px;background:#160d1d;color:var(--text);padding:9px 11px;cursor:pointer;font:13px ui-monospace,monospace;overflow-wrap:anywhere}.empty{color:#987ea8;font-size:13px;padding:6px 0}
@media(max-width:360px){body{padding:12px}.calc{padding:12px}.keys{gap:6px}.key{min-height:47px}}
</style>
</head>
<body>
<main class="app">
  <div class="top"><div class="brand">A tiny language machine</div><div class="badge">BASE 26</div></div>
  <h1>LetterCalc<span style="color:var(--accent)">.</span></h1>
  <p class="sub">Math, but every number wears letters.</p>
  <section class="calc" aria-label="Letter calculator">
    <div class="display" aria-live="polite">
      <div class="expression" id="expression">Ready when you are</div>
      <div class="result" id="result">MAX</div>
      <div class="decimal" id="decimal">M = 12 · A = 0 · X = 23</div>
    </div>
    <div class="keys" id="keys">
      <button class="key utility" data-action="clear">AC</button><button class="key utility" data-action="back">⌫</button><button class="key op" data-value="^">xʸ</button><button class="key op" data-value="/">÷</button>
      <button class="key alpha" data-value="A">A</button><button class="key alpha" data-value="B">B</button><button class="key alpha" data-value="C">C</button><button class="key op" data-value="*">×</button>
      <button class="key alpha" data-value="D">D</button><button class="key alpha" data-value="E">E</button><button class="key alpha" data-value="F">F</button><button class="key op" data-value="-">−</button>
      <button class="key alpha" data-value="G">G</button><button class="key alpha" data-value="H">H</button><button class="key alpha" data-value="I">I</button><button class="key op" data-value="+">+</button>
      <button class="key alpha" data-value="J">J</button><button class="key alpha" data-value="K">K</button><button class="key alpha" data-value="L">L</button><button class="key alpha" data-value="M">M</button>
      <button class="key alpha" data-value="N">N</button><button class="key alpha" data-value="O">O</button><button class="key alpha" data-value="P">P</button><button class="key alpha" data-value="Q">Q</button>
      <button class="key alpha" data-value="R">R</button><button class="key alpha" data-value="S">S</button><button class="key alpha" data-value="T">T</button><button class="key alpha" data-value="U">U</button>
      <button class="key alpha" data-value="V">V</button><button class="key alpha" data-value="W">W</button><button class="key alpha" data-value="X">X</button><button class="key alpha" data-value="Y">Y</button>
      <button class="key alpha" data-value="Z">Z</button><button class="key utility" data-value="(">(</button><button class="key utility" data-value=")">)</button><button class="key utility" data-action="sign">±</button>
      <button class="key utility wide" data-action="clear-history">Clear history</button><button class="key equals wide" data-action="equals">=</button>
    </div>
    <div class="note">A = 0 · B = 1 · … · Z = 25 · Letter strings are base-26 numbers.</div>
    <div class="history"><div class="history-head"><span>Recent answers</span></div><div class="history-list" id="history"><div class="empty">Your calculations will appear here.</div></div></div>
  </section>
</main>
<script>
(() => {
  const root = document.querySelector('.app');
  const expressionEl = root.querySelector('#expression');
  const resultEl = root.querySelector('#result');
  const decimalEl = root.querySelector('#decimal');
  const historyEl = root.querySelector('#history');
  let expression = '';
  const safe = Number.MAX_SAFE_INTEGER;

  function toNumber(word) {
    let n = 0;
    for (const ch of word.toUpperCase()) {
      n = n * 26 + ch.charCodeAt(0) - 65;
      if (!Number.isSafeInteger(n)) throw Error('That letter-number is too large.');
    }
    return n;
  }
  function toLetters(value) {
    if (!Number.isFinite(value) || Math.abs(value) > safe) throw Error('That result is too large to encode.');
    if (value < 0) return '−' + toLetters(-value);
    let n = Math.round(value);
    if (n === 0) return 'A';
    let out = '';
    while (n > 0) {
      out = String.fromCharCode(65 + n % 26) + out;
      n = Math.floor(n / 26);
    }
    return out;
  }
  function tokenize(s) {
    const tokens = []; let i = 0;
    while (i < s.length) {
      if (/\s/.test(s[i])) { i++; continue; }
      if (/[A-Z]/i.test(s[i])) {
        let word = '';
        while (i < s.length && /[A-Z]/i.test(s[i])) word += s[i++];
        tokens.push({type:'num', value:toNumber(word), text:word.toUpperCase()});
      } else if ('+-*/^()'.includes(s[i])) {
        const c = s[i++]; tokens.push({type:(c==='('||c===')')?'paren':'op',value:c});
      } else throw Error('Use letters A–Z and operators only.');
    }
    return tokens;
  }
  function evaluate(s) {
    const ts = tokenize(s); if (!ts.length) throw Error('Enter a calculation first.');
    let p = 0;
    function primary() {
      const t = ts[p++]; if (!t) throw Error('The expression is incomplete.');
      if (t.type === 'num') return t.value;
      if (t.value === '(') {
        const v = addSub();
        if (!ts[p] || ts[p++].value !== ')') throw Error('Missing closing parenthesis.');
        return v;
      }
      if (t.value === '-') return -primary();
      if (t.value === '+') return primary();
      throw Error('Expected a letter-number.');
    }
    function power() {
      const v = primary();
      if (ts[p] && ts[p].value === '^') { p++; return Math.pow(v, power()); }
      return v;
    }
    function mulDiv() {
      let v = power();
      while (ts[p] && ['*','/'].includes(ts[p].value)) {
        const op = ts[p++].value, r = power();
        if (op === '/' && r === 0) throw Error('You cannot divide by A (zero).');
        v = op === '*' ? v*r : v/r;
      }
      return v;
    }
    function addSub() {
      let v = mulDiv();
      while (ts[p] && ['+','-'].includes(ts[p].value)) {
        const op = ts[p++].value, r = mulDiv();
        v = op === '+' ? v+r : v-r;
      }
      return v;
    }
    const value = addSub();
    if (p < ts.length) throw Error('Check the order of your letters and operators.');
    if (!Number.isFinite(value) || Math.abs(value) > safe) throw Error('That result is too large.');
    return value;
  }
  function pretty(n) {
    return Number.isInteger(n) ? Math.round(n).toLocaleString('en-US') : n.toLocaleString('en-US',{maximumFractionDigits:6});
  }
  function render() {
    expressionEl.textContent = expression || 'Enter a letter-number calculation';
    try {
      const n = evaluate(expression);
      resultEl.textContent = toLetters(n);
      decimalEl.textContent = pretty(n) + (Number.isInteger(n) ? ' in decimal' : ' in decimal · letter result rounded');
    } catch (err) {
      resultEl.textContent = expression ? '…' : 'MAX';
      decimalEl.textContent = expression ? err.message : 'M = 12 · A = 0 · X = 23';
    }
  }
  function addHistory(s,n) {
    const empty = historyEl.querySelector('.empty'); if (empty) empty.remove();
    const item = document.createElement('button'); item.type='button'; item.className='hist';
    item.textContent = s + ' = ' + toLetters(n);
    item.title = 'Click to reuse this calculation';
    item.addEventListener('click',()=>{expression=s;render();});
    historyEl.prepend(item);
    while (historyEl.children.length > 6) historyEl.lastElementChild.remove();
  }
  root.querySelector('#keys').addEventListener('click',e=>{
    const b=e.target.closest('button'); if(!b)return;
    const action=b.dataset.action;
    if(action==='clear'){expression='';render();return;}
    if(action==='back'){expression=expression.slice(0,-1);render();return;}
    if(action==='clear-history'){historyEl.innerHTML='<div class="empty">Your calculations will appear here.</div>';return;}
    if(action==='sign'){expression=expression.startsWith('-')?expression.slice(1):'-'+expression;render();return;}
    if(action==='equals'){
      try{const n=evaluate(expression);addHistory(expression,n);expression=toLetters(n);render();}
      catch(err){decimalEl.textContent=err.message;}
      return;
    }
    if(b.dataset.value){expression+=b.dataset.value;render();}
  });
  root.addEventListener('keydown',e=>{
    if(e.target.matches('button'))return;
    if(/^[a-z]$/i.test(e.key)){expression+=e.key.toUpperCase();render();}
    else if('+-*/^()'.includes(e.key)){expression+=e.key;render();}
    else if(e.key==='Backspace'){expression=expression.slice(0,-1);render();}
    else if(e.key==='Enter'||e.key==='='){e.preventDefault();try{const n=evaluate(expression);addHistory(expression,n);expression=toLetters(n);render();}catch(err){decimalEl.textContent=err.message;}}
    else if(e.key==='Escape'){expression='';render();}
  });
  render();
})();
</script>
</body>
</html>
